<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Zoom stays enabled (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitchFold</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%;
      background: #F5F0E8;
      font-family: 'Inter Tight', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    /* Prevent iOS rubber-band scroll inside the plugin UI */
    body { overscroll-behavior: none; touch-action: none; }
    /* Touch targets (house rule ≥44px on coarse pointers): the inline PAPER
       buttons/selects size 19-23px tall by padding; min-height wins over
       inline height, so this scales them without touching call sites. */
    @media (pointer: coarse) {
      button, select { min-height: 44px; }
      input[type="text"] { min-height: 44px; }
    }
      /* Visually hidden, still announced (see .es-sr-only in @enkerli/ui tokens).
       Inlined so the heading is hidden from the FIRST paint, before any
       bundle's CSS loads — otherwise the title flashes visibly. */
    .es-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <header class="es-sr-only"><h1>PitchFold</h1></header>
    <main id="root"></main>
  <script src="bundle.js?v=__BUILD_ID__"></script>
</body>
</html>
