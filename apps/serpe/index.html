<!DOCTYPE html>
<html lang="en" data-theme="light" data-runtime="webapp">
<head>
<meta charset="utf-8">
<!-- Zoom stays enabled (WCAG 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpe</title>
<!-- Fonts self-hosted: main.jsx injects @enkerli/ui/fonts.css and the build
     copies the woff2 into dist/fonts (no Google Fonts CDN — offline + CSP-safe).
     Styles are bundled into bundle.js (imported as text) and injected at runtime -->
<style>
  html, body { height: 100%; }
  body { overscroll-behavior: none; }
  #root { min-height: 100%; }
    /* Visually hidden, still announced (see .es-sr-only in @enkerli/ui tokens).
       Inlined so the heading is hidden from the FIRST paint, before any
       bundle's CSS loads — otherwise the title flashes visibly. */
    .es-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  </style>
</head>
<body>
<header class="es-sr-only"><h1>Serpe</h1></header>
    <main id="root"></main>
<script src="bundle.js?v=__BUILD_ID__"></script>
</body>
</html>
