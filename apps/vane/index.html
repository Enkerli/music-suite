let PRESETS=[
  {name:"Reedlike · Lyrical",tags:["breath","mono","soft"],ctrl:"Sylphyo",scale:"12-EDO",fav:true},
  {name:"Buzz · Clarinet-ish",tags:["breath","fat","reso"],ctrl:"Sylphyo",scale:"12-EDO",fav:false},
  {name:"Glass Tube",tags:["expr","pure","high"],ctrl:"EWI",scale:"Just",fav:true},
  {name:"Hex Drone",tags:["mpe","drone","wide"],ctrl:"Exquis",scale:"19-EDO",fav:false},
  {name:"Bent Reed",tags:["breath","bend","micro"],ctrl:"Sylphyo",scale:"31-EDO",fav:true},
  {name:"Touch Whisper",tags:["mpe","soft","noise"],ctrl:"Sensel Morph",scale:"Just",fav:false},
];
const TAGC={breath:"--vn-breath",expr:"--vn-expr",mpe:"--vn-pressure",bend:"--vn-bend",slide:"--vn-slide"};
let selPreset=0, pQuery='', pFilter={type:null,value:null};
const Preset={ step(d){ selPreset=(selPreset+d+PRESETS.length)%PRESETS.length;
  $('#presetName').textContent=PRESETS[selPreset].name; state.dirty=false; $('#unsaved').classList.remove('on');
  if(tab==='presets')renderPresets(); Bridge.send('presetLoad',{id:selPreset}); } };
function pmatch(p){
  if(pQuery && !(p.name+' '+p.tags.join(' ')).toLowerCase().includes(pQuery.toLowerCase())) return false;
  if(pFilter.type==='ctrl' && p.ctrl!==pFilter.value) return false;
  if(pFilter.type==='tag' && !p.tags.includes(pFilter.value)) return false;
  if(pFilter.type==='scale' && p.scale!==pFilter.value) return false;
  if(pFilter.type==='fav' && !p.fav) return false;
  return true;
}
function setPFilter(type,value){ if(pFilter.type===type&&pFilter.value===value){pFilter={type:null,value:null};}else{pFilter={type,value};} renderPresets(); }
function glyphSvg(seed){ let d=''; for(let i=0;i<=20;i++){const x=i/20*46,y=15+Math.sin(i*0.5+seed)*9*Math.sin(i*0.16+seed);d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);} return `<svg width="46" height="30" viewBox="0 0 46 30"><path d="${d}" fill="none" stroke="var(--vn-breath)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/></svg>`; }
function renderPresets(){
  // Drop empty metadata so the sidebar doesn't show blank Controller/Tag/Scale
  // rows (PresetManager stores only names until preset metadata exists).
  const ctrls=[...new Set(PRESETS.map(p=>p.ctrl).filter(Boolean))];
  const tags=[...new Set(PRESETS.flatMap(p=>p.tags||[]).filter(Boolean))];
  const scales=[...new Set(PRESETS.map(p=>p.scale).filter(Boolean))];
  const f=(type,value,label,count)=>`<div class="filter ${pFilter.type===type&&pFilter.value===value?'on':''}" onclick="setPFilter('${type}','${value}')"><span>${label}</span><span class="c num">${count}</span></div>`;
  const grp=(title,items)=> items.length?`<div class="filter-group"><span class="eyebrow">${title}</span>${items}</div>`:'';
  const list=PRESETS.map((p,i)=>({p,i})).filter(x=>pmatch(x.p));
  const listHtml = list.length? list.map(({p,i})=>`<div class="preset-item ${i===selPreset?'sel':''}" data-idx="${i}" onclick="pickPreset(${i})">
      <span class="glyph">${glyphSvg(i)}</span>
      <div><div class="nm">${p.name}</div><div class="tags">${p.tags.map(t=>`<span class="tag" style="background:var(${TAGC[t]||'--vn-muted'})">${t}</span>`).join('')}</div></div>
      <span class="fav" onclick="event.stopPropagation();toggleFav(${i})">${p.fav?'★':'☆'}</span>
      <span class="kebab" onclick="event.stopPropagation();toggleMenu(${i},this)">⋯<div class="menu" id="menu_${i}">
        <button onclick="event.stopPropagation();renamePreset(${i})">Rename</button>
        <button onclick="event.stopPropagation();duplicatePreset(${i})">Duplicate</button>
        <button class="danger" onclick="event.stopPropagation();deletePreset(${i})">Delete</button></div></span>
    </div>`).join('')
    : `<div class="empty-state"><div class="big">No presets match</div><div>Clear filters or save a new patch.</div></div>`;
  $('#tabbody').innerHTML=`<div class="preset-grid">
    <div class="preset-side">
      <input class="search" placeholder="search presets…" value="${pQuery}" oninput="pQuery=this.value;renderPresets()" />
      ${PRESETS.some(p=>p.fav)?grp('Favorites',f('fav','1','★ Favorites',PRESETS.filter(p=>p.fav).length)):''}
      ${grp('Controller',ctrls.map(c=>f('ctrl',c,c,PRESETS.filter(p=>p.ctrl===c).length)).join(''))}
      ${grp('Tag',tags.map(t=>f('tag',t,t,PRESETS.filter(p=>(p.tags||[]).includes(t)).length)).join(''))}
      ${grp('Scale',scales.map(s=>f('scale',s,s,PRESETS.filter(p=>p.scale===s).length)).join(''))}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" onclick="savePreset()">+ Save current</button>
        <button class="btn" onclick="importExport()">Import / Export</button>
      </div>
    </div>
    <div class="preset-list">${listHtml}</div>
  </div>`;
}
function pickPreset(i){ selPreset=i; $('#presetName').textContent=PRESETS[i].name; state.dirty=false; $('#unsaved').classList.remove('on'); Bridge.send('presetLoad',{id:i}); renderPresets(); }
function toggleFav(i){ PRESETS[i].fav=!PRESETS[i].fav; renderPresets(); }
let openMenu=null;
function toggleMenu(i,el){ const m=$('#menu_'+i); const willOpen=!m.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'));
  if(willOpen)m.classList.add('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.kebab'))document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open')); });
// Right-click: suppress the WebView's "Inspect element" and route to a real
// contextual menu where we have one (sliders open their own; preset rows reuse
// the ⋯ menu). Text fields keep their native cut/copy/paste menu.
document.addEventListener('contextmenu',e=>{
  const t=e.target, tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||t.isContentEditable) return;   // native menu on fields
  if(t.closest('.track,.bipolar')) return;                            // slider handles its own
  const pi=t.closest('.preset-item');
  if(pi){ e.preventDefault(); const idx=+pi.dataset.idx;
    document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'));
    const m=document.getElementById('menu_'+idx); if(m) m.classList.add('open'); return; }
  e.preventDefault();   // everywhere else: no accidental "Inspect element"
});
function savePreset(){
  const suggested = (PRESETS[selPreset] && PRESETS[selPreset].name) || '';
  openModal(`<h3>Save preset</h3><p>Name this patch — it is written to disk and shows up in the browser.</p>
    <input class="rn" id="spInp" placeholder="My Patch" value="${suggested.replace(/"/g,'&quot;')}" />
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commitSave()">Save</button></div>`);
  setTimeout(()=>{ const e=$('#spInp'); if(e){ e.focus(); e.select(); e.onkeydown=ev=>{ if(ev.key==='Enter')commitSave(); }; } },30);
}
function commitSave(){ const v=$('#spInp').value.trim(); if(!v){ $('#spInp').focus(); return; }
  Bridge.send('presetSave',{name:v});
  state.dirty=false; $('#unsaved').classList.remove('on'); $('#presetName').textContent=v;
  closeModal();
  if(!HAS_JUCE){ PRESETS.push({name:v,tags:[],ctrl:'',scale:'',fav:false}); selPreset=PRESETS.length-1; renderPresets(); }
  // With the plugin, presetSave triggers a presetList push that refreshes the browser.
}
function duplicatePreset(i){ const c={...PRESETS[i],name:PRESETS[i].name+' copy',fav:false,tags:[...PRESETS[i].tags]}; PRESETS.splice(i+1,0,c); renderPresets(); }
// W5: delete optimistically in the UI but DEFER the real (irreversible) delete to
// the engine until the undo toast expires, so "Undo" is a true cancel.
let _pendingDelete=null;
function flushPendingDelete(){ if(_pendingDelete){ const p=_pendingDelete; _pendingDelete=null; clearTimeout(p.timer); Bridge.send('presetDelete',{id:p.id}); } }
function deletePreset(i){
  flushPendingDelete();                       // never hold two pending (index stays valid)
  const removed=PRESETS[i], id=i; PRESETS.splice(i,1);
  if(PRESETS.length===0){ $('#presetName').textContent='—'; }
  else { selPreset=Math.min(selPreset,PRESETS.length-1); $('#presetName').textContent=PRESETS[selPreset].name; }
  renderPresets();
  const timer=setTimeout(()=>{ if(_pendingDelete){ _pendingDelete=null; Bridge.send('presetDelete',{id}); } }, 5000);
  _pendingDelete={ id, timer };
  showToast('Deleted "'+removed.name+'"','Undo',()=>{
    if(_pendingDelete){ clearTimeout(_pendingDelete.timer); _pendingDelete=null;
      PRESETS.splice(id,0,removed); selPreset=id; $('#presetName').textContent=removed.name; renderPresets(); }
  });
}

let mono=true;
function toggleMono(){ mono=!mono; $('#monoBtn').textContent=mono?'Mono':'Poly'; Bridge.send('setParam',{id:'monoMode',value:mono?1:0}); markDirty(); }

// Controller chip → opens the Controllers / profile setup (binding + MIDI-learn).
function openCtrlMenu(e){ if(e)e.stopPropagation(); closeMenus(); openControllers(); }
// The header pill shows the active controller PROFILE when one is loaded
// (e.g. "Alfonsylphyo"), falling back to the bare controller name.
function ctrlPillText(){ return state.profileName || state.controller || 'Generic MPE'; }
function updateCtrlPill(){ const e=$('#ctrlName'); if(e)e.textContent=ctrlPillText(); }
// ── Rig (Stage 2a): a composition of controller instances ─────────────────────
function rigInstances(){ return (state.rig&&state.rig.instances)||[]; }
function persistRig(){ Bridge.send('setRig',{rig:JSON.stringify(state.rig)}); markDirty(); }
// Parse a channel-match string ("any" | "1" | "2-16" | "1,10") → 16-bit mask.
function chSet(s){ s=(s||'any').trim().toLowerCase();
  if(s===''||s==='any'||s==='omni') return 0xFFFF;
  let m=0; s.split(',').forEach(tok=>{ tok=tok.trim(); const r=tok.match(/^(\d+)\s*-\s*(\d+)$/);
    if(r){ let a=+r[1],b=+r[2]; if(a>b){const t=a;a=b;b=t;} for(let c=a;c<=b;c++) if(c>=1&&c<=16)m|=1<<(c-1); }
    else { const n=+tok; if(n>=1&&n<=16)m|=1<<(n-1); } });
  return m||0xFFFF; }
// Compile the rig's per-instance roles + channel match → two 16-bit masks the
// engine applies: notes pass on channels an instance claims with Notes on; mod
// on channels claimed with Mod on. Empty → 0xFFFF (accept all), so a plain
// single-controller rig changes nothing.
function applyRouting(){ let nm=0, mm=0;
  rigInstances().forEach(it=>{ const cs=chSet(it.ch); if(it.notes)nm|=cs; if(it.mod)mm|=cs; });
  Bridge.send('setMidiRouting',{notesMask:(nm||0xFFFF)&0xFFFF, modMask:(mm||0xFFFF)&0xFFFF}); }
// Compile the rig's instances down to the flat binding pool the engine reads:
// breath from the first instance that has one; aux = each instance's catalog
// sources concatenated (capped at 8). Roles + match are stored, not yet enforced
// (the 2b router does that). Reseeds on structural edits only — never on load,
// so manual Learn/CC tweaks survive.
function applyRig(){
  const insts=rigInstances();
  const primary=(insts[0]&&insts[0].ctrl)||'Generic MPE';
  state.controller=primary;
  Bridge.send('setController',{name:primary});
  // breath: first instance whose controller sends it
  let breath=null;
  for(const it of insts){ const c=catEntry(it.ctrl); if(c&&typeof c.breathCC==='number'){ breath=c.breathCC; break; } }
  if(breath!==null){ state.cc.Breath=breath; Bridge.send('setMacroCC',{which:'breath',cc:breath}); }
  // aux: concatenate every instance's catalog aux, cap 8
  let merged=[]; for(const it of insts){ const c=catEntry(it.ctrl); (c&&c.aux||[]).forEach(a=>merged.push({label:a.label,cc:a.cc||0})); }
  merged=merged.slice(0,8);
  merged.forEach((a,i)=>{ state.aux[i]={label:a.label,cc:a.cc};
    Bridge.send('setAuxLabel',{aux:i,label:a.label}); Bridge.send('setAuxCC',{aux:i,cc:a.cc}); });
  // mono: engage if any instance is a wind
  if(insts.some(it=>{const c=catEntry(it.ctrl);return c&&c.mono;}) && !mono){
    mono=true; const b=$('#monoBtn'); if(b)b.textContent='Mono'; Bridge.send('setParam',{id:'monoMode',value:1}); }
  persistRig(); applyRouting(); buildMeters(); updateCtrlPill();
  if(ctrlOpen)renderControllers(); if(tab==='matrix')renderMatrix();
}
function setInstanceCtrl(i,c){ if(!rigInstances()[i])return; state.rig.instances[i].ctrl=c; state.rig.instances[i].mode=''; applyRig(); }
function addInstance(){ state.rig.instances.push({ctrl:'Generic MPE',mode:'',notes:true,mod:true,ch:'any'}); applyRig(); }
function removeInstance(i){ if(rigInstances().length<=1)return; state.rig.instances.splice(i,1); applyRig(); }
function toggleRole(i,which){ const it=rigInstances()[i]; if(!it)return; it[which]=!it[which]; persistRig(); applyRouting(); renderControllers(); }
function setInstanceCh(i,v){ const it=rigInstances()[i]; if(!it)return; it.ch=(v||'any').trim()||'any'; persistRig(); applyRouting(); }
// Back-compat shim for any caller that set "the controller".
function setCtrl(c){ setInstanceCtrl(0,c); closeMenus(); }

// ── Controllers panel: source profile (per-note MPE + global aux, learnable) ──
let learnAux=-1, ctrlOpen=false, probeRunning=false;
// Per-note dimensions come from MPE — informational, never reassigned here.
const PERNOTE=[
  ['Pressure','MPE channel pressure','pressure'],
  ['Slide','CC74 · MPE Y','slide'],
  ['Pitchbend','Pitch bend · MPE X','bend'],
  ['Velocity','Note-on','vel'],
];
// ── Controller catalog — a hand-seeded snapshot mirroring Manifold YAML facts
// (manifold/controllers/**.yaml).  Eventually generated by a Manifold→Vane
// exporter; for now it proves the pipe.  Picking a controller seeds the global
// Breath CC, the Aux labels/CCs, and shows the controller's notes.  Honest CCs
// only: where Manifold documents a number we use it; encoder/accelerometer CCs
// that depend on the device's own config are left at 0 with a "Learn" prompt.
//   breathCC: number → seed Breath macro · null → controller has no breath
//   aux: [{label, cc}]  (cc 0 = unknown, assign via Learn)
//   sources: canonical dims the controller actually sends — drives which meters
//            and visualiser traces are shown (no flat "slide" line on a wind).
//   mono: true → picking it engages Mono mode (wind controllers play one line).
const CATALOG = {
  'Generic MPE':         { mpe:true,  breathCC:null, sources:['Pressure','Slide','Pitchbend','Velocity'], aux:[], note:'Bare MPE: per-note pitch/slide/pressure. Add your controller for tailored sources.' },
  'Sylphyo':             { mpe:true,  breathCC:2,    mono:true, sources:['Breath','Pitchbend','Velocity'], aux:[], note:'Wind controller. Breath on CC2, bite = channel pressure. MPE or single-channel per its app; in MPE set pitch-bend range to 48 to match.' },
  'LinnStrument':        { mpe:true,  breathCC:null, sources:['Pressure','Slide','Pitchbend','Velocity'], aux:[], note:'MPE grid. Per-pad pressure (Z), slide (Y/CC74), pitch (X). No breath.' },
  'EWI-USB':             { mpe:false, breathCC:2,    mono:true, sources:['Breath','Pitchbend','Velocity'], aux:[], note:'Breath on CC2. No per-note expression — single channel wind controller.' },
  'Zefiro Pro':          { mpe:false, breathCC:2,    mono:true, sources:['Breath','Pitchbend','Velocity'], aux:[{label:'Accel X',cc:0},{label:'Accel Y',cc:0},{label:'Accel Z',cc:0}], note:'Breath on CC2. Pro 3-axis accelerometer → 3 aux; CCs not yet documented in Manifold, so assign via Learn.' },
  'Exquis':              { mpe:true,  breathCC:null, sources:['Pressure','Slide','Pitchbend','Velocity'], aux:[{label:'Encoder 1',cc:0},{label:'Encoder 2',cc:0},{label:'Encoder 3',cc:0},{label:'Encoder 4',cc:0}], note:'MPE surface. Four push-encoders → 4 aux; CC numbers depend on your Exquis / BWS config — assign via Learn.' },
  'Sensel Morph':        { mpe:true,  breathCC:null, sources:['Pressure','Slide','Pitchbend','Velocity'], aux:[], note:'High-res MPE pressure surface. Slide on CC74. Swappable overlays — see the Thunder profile.' },
  'Sensel Morph · Thunder':{ mpe:true, breathCC:null, sources:['Pressure','Pitchbend','Velocity'], aux:[], note:'Buchla Thunder overlay. An on-overlay button switches sub-layouts — save one Vane profile per layout.' },
  'Keystep':             { mpe:false, breathCC:null, sources:['Pitchbend','Velocity'], aux:[{label:'Mod Wheel',cc:1}], note:'Keyboard + touch strips. Mod wheel on CC1, sustain on CC64.' },
  'MicroFreak':          { mpe:false, breathCC:null, sources:['Pressure','Pitchbend','Velocity'], aux:[{label:'Mod Wheel',cc:1}], note:'Keyboard synth that also sends: aftertouch + mod wheel (CC1). (Not yet in Manifold — a good addition.)' },
};
// Legacy / bare controller names → catalog keys (older saved profiles stored
// "Sylphyo", "EWI", "Zefiro" before the catalog gained variant suffixes).
const CTRL_ALIAS = { 'Sylphyo (MPE)':'Sylphyo', 'Sylphyo (Standard)':'Sylphyo', 'EWI':'EWI-USB', 'Zefiro':'Zefiro Pro', 'Generic':'Generic MPE' };
function resolveCtrlKey(name){
  if(!name) return 'Generic MPE';
  if(CATALOG[name]) return name;
  if(CTRL_ALIAS[name] && CATALOG[CTRL_ALIAS[name]]) return CTRL_ALIAS[name];

  const pre = Object.keys(CATALOG).find(k=>k.startsWith(name+' (')||k.startsWith(name+' ·'));

// Canonical sources active across the rig (union of every instance's sources) —

function ctrlSources(){
  const insts=rigInstances();

    insts.forEach(it=>{ const c=catEntry(it.ctrl); (c&&c.sources||[]).forEach(s=>set.add(s)); });
    if(set.size) return [...set]; }

function probeReadout(){
  const p=state.probe;
  if(!probeRunning && !p.events) return 'Not running.';
  const chans = p.channels.length? p.channels.join(', ') : '— none yet —';
  const srcs  = p.sources.length? p.sources.map(s=>{
    const tag = s.opened===true ? `opened · direct <b>${Math.round(s.events||0)}</b>`
              : s.opened===false ? '<b>could not open</b>' : 'visible';
    return `&nbsp;&nbsp;• ${s.name||'(unnamed)'} — ${tag}`;
  }).join('<br>') : '— none visible —';
  const vps = (p.vports||[]).map(v=>{
    const vch = (v.channels&&v.channels.length)? v.channels.join(', ') : '—';
    return `&nbsp;&nbsp;"${v.name}": ${v.created?'created':'<b>NOT created</b>'}, received <b>${Math.round(v.events||0)}</b> (ch ${vch})`;
  }).join('<br>');
  return `Host stream — events: <b>${Math.round(p.events)}</b>&nbsp;(~${(p.rate||0).toFixed(0)}/s), channels: <b>${chans}</b><br>`
       + `MIDI sources visible (<b>${p.sources.length}</b>):<br>${srcs}`
       + (vps? `<br>Test input ports (route sources to these in your host):<br>${vps}` : '');
}

  Bridge.send(probeRunning?'requestMidiProbe':'stopMidiProbe'); renderControllers(); }
function resetProbe(){ state.probe.events=0; state.probe.prevEvents=0; state.probe.rate=0; Bridge.send('resetMidiProbe'); }
function closeControllers(){ ctrlOpen=false; if(learnAux>=0){Bridge.send('auxLearnCancel');learnAux=-1;}
  if(probeRunning){ probeRunning=false; Bridge.send('stopMidiProbe'); } closeModal(); }
function auxLearnToggle(i){ if(learnAux===i){ Bridge.send('auxLearnCancel'); learnAux=-1; }
  else { if(learnAux>=0)Bridge.send('auxLearnCancel'); learnAux=i; Bridge.send('auxLearn',{aux:i}); } renderControllers(); }

function auxLabel(i,v){ v=(v||'').trim()||('Aux '+(i+1)); if(state.aux[i])state.aux[i].label=v; Bridge.send('setAuxLabel',{aux:i,label:v}); if(tab==='matrix')renderMatrix(); }

// ════════════════════════════════════════════════════════════════════════
//  Tuning surface — 4th Stage view (lifted from Claude Design handoff, area 4)
// ════════════════════════════════════════════════════════════════════════
// Note names (ASCII safe — never passed through C++ strings).
const PC = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
// Internal tuning library matching TuningClient::setInternalTuning ids.
const TUN = {
  edo12:  {name:"12-tone Equal",      sys:"12-EDO 100c/step",        keys:12, cents:[0,100,200,300,400,500,600,700,800,900,1000,1100], holes:[]},
  just:   {name:"Just Intonation",    sys:"5-limit / C major",       keys:12, cents:[0,111.7,203.9,315.6,386.3,498.0,590.2,702.0,813.7,884.4,996.1,1088.3], holes:[]},
  pyth:   {name:"Pythagorean",        sys:"3-limit / chain of 5ths", keys:12, cents:[0,113.7,203.9,294.1,407.8,498.0,611.7,702.0,815.6,905.9,996.1,1109.8], holes:[]},
  meanqc: {name:"Quarter-comma Meantone", sys:"fifth 696.6c",        keys:12, cents:[0,76.0,193.2,310.3,386.3,503.4,579.5,696.6,772.6,889.7,1006.8,1082.9], holes:[]},
  werck3: {name:"Werckmeister III",   sys:"1691 well-temperament",   keys:12, cents:[0,90.2,192.2,294.1,390.2,498.0,588.3,696.1,792.2,888.3,996.1,1092.2], holes:[]},
  diat7:  {name:"Just Diatonic",      sys:"7 notes / 5 holes",       keys:12, cents:[0,null,203.9,null,386.3,498.0,null,702.0,null,884.4,null,1088.3], holes:[1,3,6,8,10]},
  edo19:  {name:"19-tone Equal",      sys:"19-EDO / 63.2c step",     edo:19,  period:1200},
  bp:     {name:"Bohlen-Pierce",      sys:"13 / tritave (non-octave)",edo:13,  period:1901.955},
};
const TUN_ORDER = ["edo12","just","pyth","meanqc","werck3","diat7","edo19","bp"];

const tuningState = { source:'mts', internal:'just', name:'', sys:'', devTable:[], holeFlags:[] };

// Deviation-profile map SVG (the characterful wiggle IS the temperament).
function tuningMapSvg(devTable, holeFlags, live, big){
  const W=big?540:300, H=big?160:130, padX=16, top=22, zero=Math.round(H*0.52);
  const degs = devTable.map((dev,k)=>({label:PC[k%12], dev, hole:holeFlags[k%12]||false, idx:k%12}));
  const maxDev = Math.max(15, ...degs.filter(d=>!d.hole).map(d=>Math.abs(d.dev)));
  const half = Math.min(zero-top, H-20-zero);
  const Y=dev=>zero-(dev/maxDev)*half;
  const n=degs.length, X=i=>padX+(n<=1?0:i/(n-1)*(W-2*padX));
  let g='';
  g+=`<line class="lane" x1="${padX}" y1="${zero}" x2="${W-padX}" y2="${zero}"/>`;
  g+=`<text class="cents" x="${padX}" y="${(Y(maxDev)-3).toFixed(1)}" >+${Math.round(maxDev)}c</text>`;
  g+=`<text class="cents" x="${padX}" y="${(Y(-maxDev)+9).toFixed(1)}">-${Math.round(maxDev)}c</text>`;
  g+=`<text class="cents" x="${(W-padX).toFixed(1)}" y="${(zero-3).toFixed(1)}" text-anchor="end">equal</text>`;
  const poly=degs.map((d,i)=>d.hole?null:`${X(i).toFixed(1)},${Y(d.dev).toFixed(1)}`).filter(Boolean);
  if(poly.length>1) g+=`<polyline points="${poly.join(' ')}" fill="none" stroke="var(--vn-slide)" stroke-width="1.4" opacity="0.4"/>`;
  degs.forEach((d,i)=>{
    const x=X(i);
    if(d.hole){ g+=`<line class="holex" x1="${(x-4).toFixed(1)}" y1="${(zero-4).toFixed(1)}" x2="${(x+4).toFixed(1)}" y2="${(zero+4).toFixed(1)}"/>`;
      g+=`<line class="holex" x1="${(x-4).toFixed(1)}" y1="${(zero+4).toFixed(1)}" x2="${(x+4).toFixed(1)}" y2="${(zero-4).toFixed(1)}"/>`;
      g+=`<text class="pc" x="${x.toFixed(1)}" y="${(H-5).toFixed(1)}" text-anchor="middle" fill="var(--vn-pressure)">${d.label}</text>`; return; }
    const lit=live.has(d.idx), y=Y(d.dev);
    g+=`<line x1="${x.toFixed(1)}" y1="${zero}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${lit?'var(--vn-bend)':'var(--vn-slide)'}" stroke-width="${lit?2.4:1.6}" opacity="${lit?1:.7}" stroke-linecap="round"/>`;
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${lit?4.4:3}" fill="${lit?'var(--vn-bend)':'var(--vn-slide)'}" stroke="var(--vn-panel)" stroke-width="1.4"/>`;
    g+=`<text class="pc" x="${x.toFixed(1)}" y="${(H-5).toFixed(1)}" text-anchor="middle" fill="${lit?'var(--vn-bend)':'var(--vn-muted)'}">${d.label}</text>`;
    if(lit) g+=`<text class="livelbl" x="${x.toFixed(1)}" y="${(y+(d.dev>=0?-8:14)).toFixed(1)}" text-anchor="middle">${d.dev>=0?'+':''}${d.dev.toFixed(1)}</text>`;
  });
  return `<svg class="tm-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function livePcSet(){
  const out=new Set();
  for(const v of (state.voices||[])){
    if(!v.hz||v.hz<16) continue;
    const c=1200*Math.log2(v.hz/16.3516);
    out.add(Math.round(((c%1200)+1200)%1200/100)%12);
  }
  return out;
}
function precSegInline(){
  const t=tuningState;
  const seg=(id,lbl,on,dis)=>`<button class="pbtn ${on?'on':''}" data-prec="${id}" ${dis?'disabled':''}>${lbl}</button>`;
  return `<div class="seg">${seg('mts','MTS',t.source==='mts',!state.mts)}${seg('internal','Internal',t.source==='internal',false)}${seg('off','Bypass',t.source==='off',false)}</div>`;
}
function sourceName(){ const t=tuningState; const tn=TUN[t.internal]||TUN.just;
  if(t.source==='off')      return '12-tone Equal';
  if(t.source==='internal') return tn.name;
  // FollowMTS: show the master name when connected; explicit "No master" otherwise
  // so the display never shows the internal tuning name in the master section.
  return state.mts ? (t.name||'Connected') : 'No master'; }
function sourceSys(){ const t=tuningState; const tn=TUN[t.internal]||TUN.just;
  if(t.source==='off')      return '12-EDO 100c/step';
  if(t.source==='internal') return tn.sys;
  return state.mts ? '' : 'Waiting for MTS-ESP master'; }
// Nearest 12-ET name + cents offset for a frequency (for the Notes panel).
function hzName(hz){ const m=69+12*Math.log2(hz/440), r=Math.round(m);
  return { name:PC[((r%12)+12)%12]+(Math.floor(r/12)-1), cents:Math.round((m-r)*100) }; }
// Sounding notes + (in Chord mode) the harmony voices generated off the played
// note at the current rotation — names, Hz, and cents-off-equal.
function soundingNotesHTML(){
  const vs=(state.voices||[]).filter(v=>v.hz>16);
  if(!vs.length) return `<div class="notes-row empty">— no notes sounding —</div>`;
  const chord=Math.round(state.patch.UniMode)===1, rot=state.chordRot||0;
  const seqs=chord?(state.chordSeqs||'').split(';').map(s=>s.trim().split(',').map(x=>x.trim()).filter(Boolean)):[];
  const row=(lbl,hz,col,extra='')=>{ const n=hzName(hz);
    return `<div class="notes-row"><span class="nl"><i style="background:var(${col})"></i>${lbl}</span>
      <span class="nn">${n.name}</span><span class="nd">${n.cents>=0?'+':''}${n.cents}¢</span>
      <span class="nh num">${hz.toFixed(1)} Hz</span><span class="nx">${extra}</span></div>`; };
  let h='';
  vs.forEach((v,vi)=>{ h+=row(v.note||'Note', v.hz, '--vn-text');
    if(chord && vi===0) seqs.forEach((seq,hi)=>{ if(!seq.length)return;
      const tok=seq[((rot%seq.length)+seq.length)%seq.length], p=chordParseTok(tok);
      h+=row('Voice '+(hi+2), v.hz*Math.pow(2,p.cents/1200), CHORD_VCOL[hi%CHORD_VCOL.length],
             p.ratio?`${p.n}/${p.d}`:tok); }); });
  return h;
}
function paintStageTuning(){
  const el=$('#tuneStage'); if(!el) return;
  const t=tuningState;
  const tn=TUN[t.internal]||TUN.just;
  // When following MTS with no master, show flat 12-ET (no holes, no deviation)
  // — the internal table is irrelevant in this mode.
  const noMaster = (t.source==='mts' && !state.mts);
  const devT  = noMaster ? new Array(12).fill(0)     : (t.devTable.length===12  ? t.devTable  : new Array(12).fill(0));
  const holeF = noMaster ? new Array(12).fill(false) : (t.holeFlags.length===12 ? t.holeFlags : new Array(12).fill(false));
  const live=livePcSet();
  el.innerHTML=`<div class="tune-stagebar">
      ${precSegInline()}
      <span class="num" style="font-size:11px;color:var(--vn-muted)">${sourceName()}</span>
      <span style="flex:1"></span>
      ${t.source==='internal'
        ? `<select data-stagepick style="max-width:160px">
             ${TUN_ORDER.map(id=>`<option value="${id}" ${t.internal===id?'selected':''}>${TUN[id].name}</option>`).join('')}
           </select>`
        : ''}
    </div>
    <div style="flex:none"><div class="tune-map">
      <div class="tm-head"><span class="eyebrow">${sourceName()} - octave map</span><span class="ref">A4 = 440 Hz</span></div>
      ${tuningMapSvg(devT, holeF, live, true)}
      <div class="tm-legend">
        <span><i style="background:var(--vn-slide)"></i>tuned degree</span>
        <span><i style="background:var(--vn-bend)"></i>sounding</span>
        <span><i style="background:var(--vn-pressure)"></i>hole</span>
      </div></div></div>
    <div class="notes-panel"><div class="np-head"><span class="eyebrow">Sounding notes</span>${Math.round(state.patch.UniMode)===1?'<span class="np-mode">chord · rot '+(state.chordRot||0)+'</span>':''}</div>
      ${soundingNotesHTML()}</div>`;
  el.querySelectorAll('[data-prec]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    tuningState.source=b.dataset.prec;
    paintStageTuning();  // immediate optimistic repaint (bridge response will confirm)
    Bridge.send('setTuningSource',{source:b.dataset.prec}); });
  const sel=el.querySelector('[data-stagepick]'); if(sel) sel.onchange=()=>{
    tuningState.internal=sel.value;
    paintStageTuning();  // immediate repaint
    Bridge.send('setInternalTuning',{id:sel.value}); };
}
// Wire tuning into setView.
const _origSetView=setView;
setView=function(v){   // override in place (not a new declaration)
  _origSetView(v);
  const vis=$('.stage .vis');
  if(vis){ vis.classList.toggle('tuning-on', v==='tuning'); vis.classList.toggle('outputs-on', v==='outputs'); }
  if(v==='tuning'){ lastLivePcKey=''; paintStageTuning(); }
  if(v==='outputs'){ const o=$('#outStage'); if(o)o.innerHTML=''; renderOutputs(); }
};
// Keep sounding-notes live while the tuning stage is open.
// Tuning live-note tracking: only repaint when sounding pitch-classes change.
// This avoids rebuilding #tuneStage innerHTML at 30 Hz, which nukes buttons
// mid-tap and prevents clicks from landing on iPad.
let lastLivePcKey='';
const _origDrawVis=drawVis;
drawVis=function(){ if(view==='tuning'){
  const key=[...livePcSet()].sort().join(',');
  if(key!==lastLivePcKey){ lastLivePcKey=key; paintStageTuning(); }
  return; }
  if(view==='outputs'){ renderOutputs(); return; }
  _origDrawVis(); };
// Header chip now jumps to the Tuning stage view.
Bridge.on('tuningStatus',({connected,source,name,internalId,devTable,holeFlags})=>{
  // Update state FIRST, then the chip — so the chip always reads fresh values.
  state.mts = connected;
  if(typeof source==='string')     tuningState.source=source;
  if(typeof name==='string')       tuningState.name=name;
  if(typeof internalId==='string') tuningState.internal=internalId;
  if(Array.isArray(devTable))      tuningState.devTable=devTable;
  if(Array.isArray(holeFlags))     tuningState.holeFlags=holeFlags;
  updateTuningChip(connected);
  // Reset livePc cache so the view repaints even when sounding notes haven't
  // changed (e.g. switching internal tunings while holding a note).
  lastLivePcKey='';
  if(view==='tuning') paintStageTuning();
});
// Chip text reflects the ACTIVE tuning, not just the MTS connection state.
function updateTuningChip(connected){ const c=$('#tuningChip'); if(!c)return;
  c.classList.toggle('warn-state', !connected && tuningState.source==='mts');
  const t=tuningState;
  let label;
  if(t.source==='off')             label = '12-EDO (bypass)';
  else if(t.source==='internal')   label = sourceName();       // e.g. "Pythagorean"
  else if(connected && t.name)     label = 'MTS: '+t.name;
  else if(connected)               label = 'MTS-ESP · on'; // · (ASCII-safe literal)
  else                             label = '⚠ MTS-ESP off · click to retry';
  c.textContent=label; c.title='Tuning — click to open'; c.onclick=()=>setView('tuning'); }
// Keep the original setMtsLabel name working (called from elsewhere).
function setMtsLabel(connected){ state.mts=connected; updateTuningChip(connected); }

// ── Incoming bridge events (real plugin pushes these) ────────────────────
Bridge.on('meters',m=>{ Object.assign(state.meters,m); if(!state.sim) tickMeters(); });
Bridge.on('paramChanged',({id,value})=>{
  if(id==='monoMode'){ mono=value>0.5; const b=$('#monoBtn'); if(b)b.textContent=mono?'Mono':'Poly'; return; }
  if(id in state.patch){ state.patch[id]=value;
    if(tab==='patch'){ const u=patchUpd[id]; if(u) u(); else renderPatch(); } } });
Bridge.on('tuningStatus',({connected})=>setMtsLabel(connected));
// Real output spectrum (log-spaced FFT magnitude bins).
Bridge.on('spectrum',({bins})=>{ if(Array.isArray(bins)) state.spec=bins; });
Bridge.on('auxMeters',({v})=>{ if(Array.isArray(v)) state.auxVals=v; });
Bridge.on('modOut',({v})=>{ if(Array.isArray(v)) state.modOut=v; });
// Active wavetable (name + frame count) — pushed on load and on boot.
Bridge.on('wavetableInfo',({name,frames,phaseAlign,ok})=>{
  if(ok && name){ state.wt={name,frames:frames||0,phaseAlign:!!phaseAlign}; }
  const e=$('#wtInfo'); if(e) e.textContent=`${state.wt.name} · ${state.wt.frames} frames`;
  const ab=$('#wtAlignBtn'); if(ab) ab.classList.toggle('primary',!!state.wt.phaseAlign);
  if(!ok){ const b=$('#wtInfo'); if(b) b.textContent='Could not load that .wav'; } });
function loadWavetableFile(){ Bridge.send('loadWavetable'); }
function useBuiltinWavetable(){ Bridge.send('useBuiltinWavetable'); }

// ── Factory wavetable library browser ────────────────────────────────────────
const MORPH_INTENT_LABELS = {
  spectral_enrichment:'spectral', brightness_ramp:'brightness',
  fold_growth:'fold', asymmetry_growth:'asymmetry', noise_growth:'noise',
  formant_shift:'formant', pulse_motion:'pulse', digital_decay:'digital',
  hybrid:'hybrid', unknown:'—'
};
Bridge.on('libraryData',({tables})=>{ if(Array.isArray(tables)) state.library=tables;
  const el=$('#libRows'); if(el) renderLibRows(el); });
Bridge.on('transientList',({names})=>{ if(Array.isArray(names)&&names.length){ state.transients=names;
  if(tab==='patch') renderPatch(); } });
function renderLibRows(el){
  el.innerHTML=(state.library||[]).map(t=>`
    <div class="lib-row ${t.active?'active':''}" onclick="pickLibTable('${t.id}')">
      <div><div class="lr-title">${t.title}${t.active?' ◆':''}</div>
        <div class="lr-meta">${t.frameCount} frames · ${MORPH_INTENT_LABELS[t.morphIntent]||t.morphIntent} · ${t.family}</div>
      </div>
      <span class="lr-badge">${t.license}</span>
    </div>`).join('');
}
function pickLibTable(id){
  Bridge.send('loadLibraryTable',{id});
  closeModal();
}
function openLibraryBrowser(){
  Bridge.send('requestLibrary');
  openModal(`<h3>Wavetable Library</h3>
    <p>Factory tables — all <b>CC0 / Public Domain</b>, bundled for iOS compatibility.
    Click a table to audition immediately; use <b>Load .wav…</b> to import your own.</p>
    <div id="libRows" class="lib-list">${(state.library||[]).length===0
      ? '<p style="color:var(--vn-muted);font-size:12px">Loading…</p>'
      : ''}</div>
    <div class="actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`);
  const el=$('#libRows'); if(el) renderLibRows(el);
}
function toggleMorphAlign(){ state.wt.phaseAlign=!state.wt.phaseAlign;
  const ab=$('#wtAlignBtn'); if(ab) ab.classList.toggle('primary',state.wt.phaseAlign);
  Bridge.send('setMorphPhaseAlign',{on:state.wt.phaseAlign}); markDirty(); }
// ── WT frame niceties: snap-to-frame + filmstrip overview ──────────────────
let morphSnap=false;
function snapMorph(v){ const n=Math.max(1,(state.wt.frames||1)-1); return Math.round(v*n)/n; }
function setMorphValue(v){ v=clamp(v,0,1); if(morphSnap)v=snapMorph(v);
  state.patch.Morph=v; Bridge.send('setParam',{id:'Morph',value:v});
  const u=patchUpd['Morph']; if(u)u(); markDirty(); }
function toggleMorphSnap(){ morphSnap=!morphSnap; const b=$('#wtSnapBtn'); if(b)b.classList.toggle('primary',morphSnap);
  if(morphSnap) setMorphValue(state.patch.Morph); }   // snap current position
function stripClick(ev){ const svg=$('#wtStrip'); if(!svg)return; const r=svg.getBoundingClientRect();
  setMorphValue((ev.clientX-r.left)/r.width); }   // scrub the table; snaps if Snap is on
function renderStrip(cols){ const svg=$('#wtStrip'); if(!svg)return;
  if(!Array.isArray(cols)||!cols.length){ svg.innerHTML=''; return; }
  const W=280,H=34,mid=H/2,amp=H*0.42,n=cols.length,cw=W/n; state.wt.stripCols=n; let p='';
  for(let c=0;c<n;c++){ const col=cols[c]||[]; let d=''; const x0=c*cw;
    for(let i=0;i<col.length;i++){ const x=x0+(i/(col.length-1))*cw*0.86+cw*0.07; const y=mid-clamp(col[i],-1,1)*amp;
      d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }
    p+=`<path d="${d}" fill="none" stroke="var(--vn-muted)" stroke-width="0.7" opacity="0.7"/>`; }
  p+=`<rect id="stripCursor" x="0" y="0" width="${cw.toFixed(1)}" height="${H}" fill="var(--vn-slide)" opacity="0.18"/>`;
  svg.innerHTML=p; positionStripCursor(state.patch.Morph*((state.wt.frames||1)-1)); }
function positionStripCursor(frame){ const sc=$('#stripCursor'); if(!sc||!(state.wt.frames>1))return;
  const W=280, cw=W/Math.max(1,state.wt.stripCols||1); sc.setAttribute('x',((frame/(state.wt.frames-1))*(W-cw)).toFixed(1)); }
Bridge.on('wavetableStrip',({cols,frames})=>{ state.wt.strip=cols; if(typeof frames==='number')state.wt.frames=frames; renderStrip(cols); });
// Live frame waveform (current morph position) → the WT display.
Bridge.on('wavetableWave',({pts,frame,frames})=>{
  const svg=$('#wtWave'); if(!svg||!Array.isArray(pts)||!pts.length)return;
  const W=240,H=60,mid=H/2,amp=H*0.46; let d='';
  for(let i=0;i<pts.length;i++){ const x=i/(pts.length-1)*W; const y=mid-clamp(pts[i],-1,1)*amp;
    d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }
  svg.innerHTML=`<line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--vn-muted-2)" stroke-width="0.5" opacity="0.5"/>`
    +`<path d="${d}" fill="none" stroke="var(--vn-slide)" stroke-width="1.6" stroke-linejoin="round"/>`;
  const fe=$('#wtFrame'); if(fe&&frames>0) fe.textContent=`frame ${(frame||0).toFixed(1)} / ${frames}`;
  positionStripCursor(frame||0); });
Bridge.on('controllerLabel',({name})=>{ if(name)state.controller=name; updateCtrlPill(); buildMeters(); });
// Live played-note readout (♪) from the engine's last note.
Bridge.on('voice',({note})=>{ const e=$('#noteRead'); if(e)e.textContent='♪ '+(note||'—'); });
// Current-patch text for the Export/Import modal.
Bridge.on('exportData',({text})=>{ const t=$('#ioTxt'); if(t)t.value=text||''; });
// Live per-note MPE expression (one entry per sounding voice) → "Notes" view.
Bridge.on('voices',({v})=>{ state.voices = Array.isArray(v)?v:[]; });
// Controller profile: aux source bindings + labels.
Bridge.on('controllerState',({aux,breathCC,exprCC,controller,rig})=>{ state.aux = Array.isArray(aux)?aux:[];
  if(typeof breathCC==='number') state.cc.Breath=breathCC;
  if(typeof exprCC==='number')   state.cc.Expression=exprCC;
  if(controller){ state.controller=controller; }
  // Restore the rig structure, or migrate a legacy (flat) profile to a 1-instance
  // rig from its controller name. Don't reseed bindings — the flat params already
  // carry them (preserves manual Learn/CC tweaks).
  let parsed=null; if(rig){ try{ parsed=JSON.parse(rig); }catch(e){} }
  if(parsed && Array.isArray(parsed.instances) && parsed.instances.length){ state.rig=parsed; }
  else { state.rig={instances:[{ctrl:resolveCtrlKey(controller||state.controller),mode:'',notes:true,mod:true,ch:'any'}]}; }
  if(state.rig.instances[0]) state.controller=state.rig.instances[0].ctrl;
  applyRouting();   // sync the engine's role masks to the (loaded/migrated) rig
  updateCtrlPill(); buildMeters();
  if(ctrlOpen)renderControllers(); if(tab==='matrix')renderMatrix(); });
// MIDI probe (diagnostics): host MIDI stats + visible CoreMIDI sources.
Bridge.on('midiProbe',({events,channels,sources,vports})=>{ const p=state.probe; const now=performance.now();
  if(p.prevT){ const dt=(now-p.prevT)/1000; if(dt>0) p.rate=Math.max(0,(events-p.prevEvents)/dt); }
  p.prevT=now; p.prevEvents=events;
  p.events=events||0; p.channels=Array.isArray(channels)?channels:[]; p.sources=Array.isArray(sources)?sources:[];
  p.vports=Array.isArray(vports)?vports:[];
  const out=$('#probeOut'); if(out) out.innerHTML=probeReadout(); });
// MIDI-learn captured a CC for an aux source.
Bridge.on('auxLearned',({aux,cc})=>{ if(state.aux[aux])state.aux[aux].cc=cc; if(learnAux===aux)learnAux=-1;
  if(ctrlOpen)renderControllers(); if(tab==='matrix')renderMatrix(); });
// Saved controller profiles list.
Bridge.on('profileList',({profiles,current})=>{ state.profiles=Array.isArray(profiles)?profiles:[];
  if(typeof current==='string') state.profileName=current; updateCtrlPill(); if(ctrlOpen)renderControllers(); });
// Preset↔profile association: a loaded patch references a saved profile.
Bridge.on('profileSuggest',({name})=>{ const b=$('#profileBanner'); if(!b)return;
  if(name){ b.querySelector('.pb-name').textContent=name; b.dataset.profile=name; b.classList.add('on'); }
  else b.classList.remove('on'); });
function applySuggestedProfile(){ const b=$('#profileBanner'); const n=b.dataset.profile;
  if(n){ state.profileName=n; updateCtrlPill(); Bridge.send('loadProfile',{name:n}); } b.classList.remove('on'); }
function dismissProfileBanner(){ $('#profileBanner').classList.remove('on'); }
// Full slot snapshot (on boot + after preset load) → refresh the matrix.
Bridge.on('slotState',({slots})=>{ if(!Array.isArray(slots))return;
  slots.forEach((s,i)=>{ if(i<NUM_SLOTS) state.slots[i]=Object.assign({atk:5,rel:80,on:true,scale:0,anchors:[]},s); });
  if(tab==='matrix')renderMatrix(); });
// Real preset library from PresetManager.
Bridge.on('presetList',({presets,selected,current})=>{ if(!Array.isArray(presets))return;
  // Defensive defaults: real PresetManager rows omit tags/fav → renderPresets()
  // calls p.tags.map(); without this the Presets tab throws and shows nothing.
  PRESETS = presets.map(p=> typeof p==='string'
      ? {name:p,tags:[],ctrl:'',scale:'',fav:false}
      : {name:'',tags:[],ctrl:'',scale:'',fav:false,...p, tags:Array.isArray(p.tags)?p.tags:[]});
  // selected may be -1 (unsaved or name not in the list) — don't fall back to 0.
  if(typeof selected==='number' && selected>=0) selPreset=clamp(selected,0,Math.max(0,PRESETS.length-1));
  // Show the actual current name from the engine; fall back to the selected row.
  const nm = (current && current.length) ? current
           : (selected>=0 && PRESETS[selPreset] ? PRESETS[selPreset].name : '');
  if(nm) $('#presetName').textContent=nm;
  if(tab==='presets')renderPresets(); });

// ── Boot + mock animation loop ───────────────────────────────────────────
state.sim = !HAS_JUCE;                 // live data from the plugin when embedded
state.aux = AUX.map((a,i)=>({label:a,cc:0}));   // default until controllerState arrives
// Single-tap typed entry on touch (Claude Design, area 6). The value fields open
// number editors via ondblclick, which is unreliable on touch; bridge tap→edit
// for coarse pointers only, leaving desktop double-click untouched. Drag controls
// set their dblclick in JS (no [ondblclick] attribute), so a tap that begins a
// drag can't accidentally open an editor.
(function(){
  const coarse = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
  if(!coarse) return;
  document.documentElement.classList.add('is-touch');
  document.addEventListener('click', e=>{
    const el=e.target.closest('[ondblclick]'); if(!el) return;
    if(el.querySelector('input')) return;            // already editing
    e.preventDefault(); e.stopPropagation();
    if(typeof el.ondblclick==='function') el.ondblclick.call(el, e);
  }, true);
})();
// Install the Focus reflow (one-pane-at-a-time on ≤860px / AUv3; desktop grid
// is untouched — all rules are gated on the narrow breakpoint).
(function installReflow(){
  const app=document.getElementById('app'); if(!app) return;
  app.dataset.reflow='focus';
  document.body.classList.add('focus-active');
  if(document.getElementById('focusbar')) return;
  const bar=document.createElement('div'); bar.className='focusbar'; bar.id='focusbar';
  const panes=[['stage','Stage'],['patch','Patch'],['matrix','Matrix'],['presets','Presets']];
  bar.innerHTML=panes.map(([id,lbl],k)=>`<button data-focus="${id}" class="${k===0?'active':''}">${lbl}</button>`).join('');
  app.querySelector('.header').insertAdjacentElement('afterend', bar);
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>focusPane(b.dataset.focus));
  const main=$('.main'); if(main) main.dataset.pane='stage';   // open on the live Stage
})();
buildMeters(); render(); Bridge.send('uiReady');
setInterval(()=>{
  if(!state.sim) return;
  simT+=0.06;
  state.meters.Breath     = (Math.sin(simT)*0.5+0.5)*0.9;
  state.meters.Expression = (Math.sin(simT*0.7+1)*0.5+0.5)*0.6;
  state.meters.Pressure   = (Math.sin(simT*1.3+2)*0.5+0.5)*0.5;
  state.meters.Slide      = (Math.sin(simT*0.5+0.5)*0.5+0.5);
  state.meters.Velocity   = 0.4;
  state.meters.Pitchbend  = Math.sin(simT*0.4)*0.4+0.5;
  // Demo per-note voices (browser preview only): three "fingers" expressing.
  const baseHz=[174.6,261.6,392.0];
  state.voices = baseHz.map((hz,i)=>({
    note:['F3','C4','G4'][i], hz, level:1,
    pressure: Math.sin(simT*(1.1+i*0.4)+i)*0.5+0.5,
    slide:    Math.sin(simT*(0.6+i*0.3)+i*2)*0.5+0.5,
    bend:     Math.sin(simT*(0.8+i*0.2)+i)*0.4,
    vel:      0.5+i*0.15,
  }));
  tickMeters();
},40);
</script>
</body>
</html>
