name: tests

# The suite had never run in CI. The only workflow was the Pages deploy, which
# installs, typechecks and builds the site but runs no tests — so 1886 tests
# across two engines held in deliberate parity (the JS in packages/upi and the
# C++ UPIParser in rhythm_pattern_explorer) were local-only. Silent drift
# between those two is the failure mode this project keeps finding by hand;
# leaving the one instrument that catches it off the runner made that a matter
# of whoever remembered.
#
# Deliberately a SEPARATE workflow from deploy-pages.yml, for two reasons:
#   - that one only fires on push to main, and only for paths that can change
#     the published site. `tools/` is (correctly) not among them, yet it holds
#     the drum-grid, timing-baseline and bridge-audit tests — so a change there
#     could break tests without triggering any workflow at all.
#   - it has no pull_request trigger, so a PR got no checks whatsoever.
#
# Publishing is NOT gated on this. A failing unit test rarely makes the
# showcase site wrong, and blocking a docs deploy on an unrelated red test is
# the kind of coupling that gets a workflow disabled. If gating is wanted
# later, the honest way is a `needs:` on a shared job, not a second copy of
# this one.

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches deploy-pages.yml. The suite was verified green on 20 as
          # well as on the 22 used locally, so the two runners agree.
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      # `pretest` runs build-packages (tsc -b) first, so this both emits the
      # shared packages' compiled output — which several tests import — and
      # runs the suite. No separate typecheck step needed here.
      #
      # tools/bridge-audit.test.mjs self-skips: it needs the plugin repos
      # checked out beside this one and CI cannot see them (BUILD.md §4). That
      # is 3 of the 1889 tests, and it is why the guard against half-wired
      # bridge events does not actually run anywhere yet.
      - name: Run the test suite
        run: npm test

  # ── The bridge audit, which until now ran nowhere ────────────────────────
  # It needs the plugin repos: the JS half of every bridge is here in apps/,
  # but the C++ half (emitEvent / withEventListener) is in seven separate
  # repos, and tools/bridge-audit.mjs resolves them as SIBLINGS of this one.
  # No sibling checkout, no audit — so the guard against half-wired events was
  # skipping in every environment, including a developer's, since the layout
  # it wants is not the one a plain clone gives you.
  #
  # A separate job because of that layout: actions/checkout cannot write
  # outside $GITHUB_WORKSPACE, so this repo moves down one level to make room
  # for the siblings beside it. Keeping it out of the `test` job leaves that
  # one fast and unaffected.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: music-suite
      # A shell loop rather than seven actions/checkout blocks: all seven are
      # public, so no token is involved, and the audit reads only <repo>/Source
      # — 1.5 MB of the ~20 MB these repos come to. Partial + sparse clone
      # fetches just that. If one is ever made private this step fails loudly,
      # which is the right outcome: a silently unscanned plugin is exactly the
      # blindness the audit exists to prevent.
      - name: Clone the plugin repos beside it (Source trees only)
        run: |
          set -euo pipefail
          for r in rhythm_pattern_explorer PitchFold Vane DrawnQurve \
                   midicurator-plugin workspace-plugin progression-studio-plugin; do
            git clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/Enkerli/$r.git" "$r"
            git -C "$r" sparse-checkout set Source
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: music-suite/package-lock.json
      - name: Install workspace dependencies
        working-directory: music-suite
        run: npm ci
      # Guards the guard. bridge-audit.mjs reports a plugin it cannot find as
      # `skipped` and carries on, and the test would still pass — so a clone
      # that half-worked would look green while auditing nothing. In CI all
      # seven must have been read.
      - name: Every plugin must actually have been scanned
        working-directory: music-suite
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            let out;
            try { out = execFileSync("node", ["tools/bridge-audit.mjs", "--json"], { encoding: "utf8" }); }
            catch (e) { out = e.stdout; }   // exit 1 when drops exist, which is normal
            const { results } = JSON.parse(out);
            const skipped = results.filter((r) => r.skipped);
            if (skipped.length) {
              console.error("NOT SCANNED: " + skipped.map((r) => `${r.name} (${r.skipped})`).join(", "));
              process.exit(1);
            }
            console.log(`all ${results.length} plugins scanned`);
          '
      # Runs the audit as a test: fails on a NEW event wired at only one end,
      # while the known drops stay listed in the test rather than blocking.
      - name: Bridge audit
        working-directory: music-suite
        run: npx vitest run tools/bridge-audit.test.mjs
