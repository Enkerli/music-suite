name: Deploy site to GitHub Pages

# The site is generated from docs/site.md by docs/build-site.mjs. Pages serves
# the docs/ folder, so build it fresh on every push and publish the result —
# no more "edit site.md, forget to rebuild, live site stays stale".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

# Least privilege for the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish (don't cancel a publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # build-site.mjs uses only Node built-ins, so no install step is needed.
      - name: Build site from docs/site.md
        run: node docs/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
