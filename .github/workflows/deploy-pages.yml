name: Deploy site to GitHub Pages

# Builds and publishes the showcase site fresh on every push, so editing any
# in-repo app's SOURCE (or docs/site.md) and pushing is enough — no manual
# rebuild step. Two stages run in the build job:
#   1. sync-apps --monorepo → rebuilds the in-repo workspace apps into docs/apps/
#      (the external plugin apps — PitchFold, DrawnQurve, Vane — live in separate
#       repos CI can't reach, so they're skipped; their committed builds ship
#       as-is and still need a local `npm run sync-apps` when they change).
#   2. build-site.mjs → regenerates index.html + content/* from docs/site.md.
# The whole docs/ tree is then uploaded as the Pages artifact (nothing committed
# back), so the live site always matches source.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/sync-apps.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

# Least privilege for the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish (don't cancel a publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      # The apps build against the shared packages' compiled output, so emit it
      # first (tsc -b). On a fresh checkout there's no dist/.tsbuildinfo, so this
      # actually emits (unlike an incremental local tree).
      - name: Build shared packages (tsc -b)
        run: npm run typecheck
      - name: Rebuild in-repo apps into docs/apps
        run: npm run sync-apps -- --monorepo
      - name: Build site from docs/site.md
        run: node docs/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
